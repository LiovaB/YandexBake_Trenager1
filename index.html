<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Диалоговый тренажёр — Кейсы по поломкам и неисправностям байка</title>
<style>
  /* ============ БАЗА ============ */
  * { box-sizing: border-box; }

  :root {
    --gold: #FFD700;
    --white: #FFFFFF;
    --grey: #E9E7E6;
    --ink: #1A1A1A;
    --muted: #8A8A8A;
    --red: #E5484D;
    --red-bg: #FFF2F2;
    --gold-bg: #FFF8DC;
  }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: 'YS Text', 'YSText', 'YS Text Regular',
                 -apple-system, BlinkMacSystemFont, 'Segoe UI',
                 Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--grey);
    color: var(--ink);
    display: flex;
    justify-content: center;
    align-items: stretch;
    padding: 24px 16px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ КАРКАС ============ */
  .app {
    width: 100%;
    max-width: 780px;
    background: var(--white);
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,.08);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: calc(100vh - 48px);
    min-height: 580px;
  }

  /* ============ ШАПКА ============ */
  .header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--grey);
    background: var(--white);
  }

  .header-top {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .header h1 {
    font-size: 17px;
    line-height: 1.25;
    margin: 0;
    font-weight: 600;
    letter-spacing: -.01em;
  }

  .header p {
    margin: 2px 0 0;
    font-size: 12.5px;
    color: var(--muted);
  }

  .progress-wrap {
    margin-top: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .progress {
    flex: 1;
    height: 6px;
    background: var(--grey);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress span {
    display: block;
    height: 100%;
    width: 0;
    background: var(--gold);
    border-radius: 3px;
    transition: width .45s cubic-bezier(.4,0,.2,1);
  }

  .step-label {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* ============ ЧАТ ============ */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: var(--white);
    scroll-behavior: smooth;
  }

  .chat::-webkit-scrollbar { width: 6px; }
  .chat::-webkit-scrollbar-thumb { background: var(--grey); border-radius: 3px; }

  .msg {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    max-width: 86%;
    animation: pop .28s cubic-bezier(.2,.9,.3,1.2);
  }

  @keyframes pop {
    from { opacity: 0; transform: translateY(10px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .msg.courier  { align-self: flex-start; }
  .msg.operator { align-self: flex-end; flex-direction: row-reverse; }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
    user-select: none;
  }

  .courier  .avatar { background: var(--grey); color: #6B6B6B; }
  .operator .avatar { background: var(--gold); color: var(--ink); }

  .bubble {
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-line;
  }

  .courier .bubble {
    background: var(--grey);
    border-bottom-left-radius: 5px;
  }

  .operator .bubble {
    background: var(--gold);
    border-bottom-right-radius: 5px;
  }

  .msg.operator.wrong .bubble {
    background: var(--red-bg);
    border: 1.5px dashed var(--red);
    color: #8C1D22;
  }

  /* индикатор «печатает» */
  .typing { display: flex; gap: 5px; align-items: center; padding: 14px 16px; }
  .typing i {
    width: 7px; height: 7px; border-radius: 50%;
    background: #B4B0AE; display: block;
    animation: blink 1.3s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }

  @keyframes blink {
    0%, 60%, 100% { opacity: .35; transform: translateY(0); }
    30%           { opacity: 1;   transform: translateY(-3px); }
  }

  /* ============ ФИДБЕК ============ */
  .feedback {
    align-self: center;
    max-width: 94%;
    font-size: 13.5px;
    line-height: 1.5;
    padding: 12px 16px;
    border-radius: 12px;
    animation: pop .28s ease;
  }

  .feedback.ok  { background: var(--gold-bg); border-left: 4px solid var(--gold); }
  .feedback.err { background: var(--red-bg);  border-left: 4px solid var(--red); }

  .feedback b { font-weight: 600; }

  /* ============ БЛОК ОТВЕТОВ ============ */
  .options {
    padding: 16px 24px 20px;
    border-top: 1px solid var(--grey);
    background: var(--white);
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 46%;
    overflow-y: auto;
  }

  .options-label {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--muted);
    margin-bottom: 2px;
  }

  .option {
    text-align: left;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1.5px solid var(--grey);
    background: var(--white);
    font-family: inherit;
    font-size: 14px;
    line-height: 1.45;
    color: var(--ink);
    cursor: pointer;
    transition: border-color .18s, background .18s, transform .12s;
  }

  .option:hover:not(:disabled) {
    border-color: var(--gold);
    background: #FFFDF2;
  }

  .option:active:not(:disabled) { transform: scale(.99); }

  .option:disabled { cursor: default; opacity: .5; }

  .option.wrong {
    border-color: var(--red);
    background: var(--red-bg);
    opacity: 1;
    cursor: default;
  }

  .option.correct {
    border-color: var(--gold);
    background: var(--gold-bg);
    opacity: 1;
    cursor: default;
  }

  /* ============ ФИНАЛ ============ */
  .result {
    align-self: center;
    width: 100%;
    max-width: 480px;
    background: var(--white);
    border: 2px solid var(--gold);
    border-radius: 16px;
    padding: 24px;
    text-align: center;
    animation: pop .35s ease;
  }

  .result-title { font-size: 20px; font-weight: 600; margin-bottom: 10px; }

  .result-score {
    font-size: 34px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1;
    margin-bottom: 12px;
  }

  .result-score span {
    display: block;
    font-size: 12px;
    font-weight: 400;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: .02em;
  }

  .result-sub { font-size: 14px; line-height: 1.5; color: #4A4A4A; }

  .restart {
    padding: 15px 20px;
    border-radius: 12px;
    border: none;
    background: var(--gold);
    color: var(--ink);
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: filter .18s, transform .12s;
  }

  .restart:hover { filter: brightness(.95); }
  .restart:active { transform: scale(.99); }

  /* ============ МОБИЛЬНЫЕ ============ */
  @media (max-width: 600px) {
    body { padding: 0; }
    .app {
      border-radius: 0;
      height: 100vh;
      min-height: 100vh;
      max-width: 100%;
    }
    .header  { padding: 16px 16px 14px; }
    .chat    { padding: 18px 16px; }
    .options { padding: 14px 16px 18px; }
    .msg     { max-width: 94%; }
    .bubble  { font-size: 14px; }
    .header h1 { font-size: 15.5px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="header-top">
      <div class="logo">🛴</div>
      <div>
        <h1>Кейсы по поломкам и неисправностям байка</h1>
        <p>Тренажёр для специалиста поддержки · аренда электровелосипедов</p>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress"><span id="progressFill"></span></div>
      <div class="step-label" id="stepLabel">Шаг 1 из 4</div>
    </div>
  </header>

  <main class="chat" id="chat"></main>
  <section class="options" id="options"></section>
</div>

<script>
/* =========================================================
   СЦЕНАРИЙ ТРЕНАЖЁРА
   Каждый шаг: реплика курьера + 3 варианта ответа оператора.
   Ровно один вариант — верный.
   ========================================================= */
const scenario = [

  /* ---------- ШАГ 1 ---------- */
  {
    courier: "Почему байк не открывается?! Приложение пишет ошибку или просто висит. Я не могу начать смену, время уходит! Срочно решите вопрос!",
    options: [
      {
        correct: true,
        text: "Вот небольшая инструкция: 1. Убедитесь, что в Яндекс Байк и на дисплее электровелосипеда нет мигающих красным или жёлтым индикаторов. 2. Попробуйте переподключить батарею.",
        feedback: "Вы дали конкретную пошаговую инструкцию и сразу подключили курьера к диагностике. Это экономит его время и решает проблему на первом уровне поддержки."
      },
      {
        correct: false,
        text: "Перезагрузите телефон, удалите и заново установите приложение — обычно это помогает.",
        feedback: "Слишком общая рекомендация. Проблема может быть в самом байке, а не в телефоне. Переустановка приложения отнимет у курьера 10–15 минут и может не помочь. Сначала — проверка индикаторов и батареи."
      },
      {
        correct: false,
        text: "Раз байк не открывается — он неисправен. Берите другой, а этот мы заберём.",
        feedback: "Нет диагностики и нет эмпатии. Курьер и так на нервах, а вы сразу «списываете» байк. Сначала нужно отработать простые шаги: индикаторы и переподключение батареи."
      }
    ]
  },

  /* ---------- ШАГ 2 ---------- */
  {
    courier: "Попробовал, не помогло. Индикаторов нет, батарею переподключал. Байк всё равно не открывается.",
    options: [
      {
        correct: true,
        text: "Пришлите, пожалуйста, видео, подтверждающее поломку Байка. На записи должен быть чётко виден номер. Мы оперативно передадим материалы специалистам для решения вопроса.",
        feedback: "Отлично! Вы запросили доказательство поломки по регламенту, объяснили, что именно должно быть на видео, и обозначили следующий шаг."
      },
      {
        correct: false,
        text: "Попробуйте ещё раз переподключить батарею — иногда помогает со второго раза.",
        feedback: "Курьер уже выполнил это действие. Повторять шаг, который не сработал, — значит тянуть время и раздражать курьера. Пора переходить к следующему этапу: запрос видео."
      },
      {
        correct: false,
        text: "Понятно. Ждите, мы что-нибудь придумаем.",
        feedback: "Нет конкретики и нет запроса доказательств. Курьер не понимает, что делать дальше и сколько ждать. Правильно — запросить видео с номером байка и передать материалы специалистам."
      }
    ]
  },

  /* ---------- ШАГ 3 ---------- */
  {
    courier: "Вот видео, номер видно. Посмотрите, пожалуйста, скорее, я жду.",
    options: [
      {
        correct: true,
        text: "Передаю ваше обращение специалисту, который поможет в решении вопроса, пожалуйста, подождите.",
        feedback: "Верно. Вы подтвердили, что видео получено, и обозначили передачу обращения специалисту — курьер понимает, что процесс идёт."
      },
      {
        correct: false,
        text: "Хорошо, видео посмотрел. Попробуйте ещё раз открыть байк, может, сейчас сработает.",
        feedback: "Вы возвращаете курьера к шагу, который уже не работает, и не передаёте обращение дальше. Это затягивает решение и снижает доверие к поддержке."
      },
      {
        correct: false,
        text: "Видео получил, но без чёткого номера байка мы ничего сделать не можем. Снимайте заново.",
        feedback: "Курьер написал, что номер видно. Отправлять его на повторную съёмку без проверки — значит обвинять клиента и терять время. Нужно передать обращение специалисту."
      }
    ]
  },

  /* ---------- ШАГ 4 ---------- */
  {
    courier: "Жду. Надеюсь, быстро решите.",
    options: [
      {
        correct: true,
        text: "Ваше обращение зарегистрировано, специалист уже занимается им. Среднее время решения — до 15 минут, я остаюсь с вами на связи. Спасибо за терпение!",
        feedback: "Идеальное завершение: подтверждение, конкретный срок и готовность помочь дальше. Курьер чувствует, что его не бросили."
      },
      {
        correct: false,
        text: "Ну, придётся подождать — от нас тут ничего не зависит.",
        feedback: "Обесценивание и перекладывание ответственности. Курьер остаётся один на один с проблемой. Нужно назвать конкретный срок и остаться на связи."
      },
      {
        correct: false,
        text: "Хорошо. Всего доброго!",
        feedback: "Преждевременное завершение диалога. Обращение ещё не решено, курьер без байка и без понимания сроков. Диалог закрывать рано."
      }
    ]
  }
];

/* =========================================================
   ЛОГИКА
   ========================================================= */
const chatEl     = document.getElementById('chat');
const optionsEl  = document.getElementById('options');
const progressEl = document.getElementById('progressFill');
const stepLabel  = document.getElementById('stepLabel');

let step = 0;
let score = 0;
let firstTry = true;

/* ---------- утилиты ---------- */
function scrollDown() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addMessage(text, type, mod) {
  const row = document.createElement('div');
  row.className = 'msg ' + type + (mod ? ' ' + mod : '');

  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = type === 'courier' ? 'К' : 'О';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  row.append(av, bubble);
  chatEl.appendChild(row);
  scrollDown();
}

function addFeedback(text, ok, prefix) {
  const box = document.createElement('div');
  box.className = 'feedback ' + (ok ? 'ok' : 'err');
  box.innerHTML = (prefix ? '<b>' + prefix + '</b> ' : '') + text;
  chatEl.appendChild(box);
  scrollDown();
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'msg courier';
  row.id = 'typingRow';
  row.innerHTML =
    '<div class="avatar">К</div>' +
    '<div class="bubble typing"><i></i><i></i><i></i></div>';
  chatEl.appendChild(row);
  scrollDown();
}

function updateProgress() {
  const done = Math.min(step, scenario.length);
  progressEl.style.width = (done / scenario.length * 100) + '%';
  if (step < scenario.length) {
    stepLabel.textContent = 'Шаг ' + (step + 1) + ' из ' + scenario.length;
  }
}

/* ---------- шаги ---------- */
function startStep() {
  if (step >= scenario.length) {
    finish();
    return;
  }

  updateProgress();
  firstTry = true;
  optionsEl.innerHTML = '';

  const current = scenario[step];
  showTyping();

  setTimeout(function () {
    const typing = document.getElementById('typingRow');
    if (typing) typing.remove();

    addMessage(current.courier, 'courier');
    renderOptions(current);
  }, 800);
}

function renderOptions(current) {
  optionsEl.innerHTML = '';

  const label = document.createElement('div');
  label.className = 'options-label';
  label.textContent = 'Выберите ответ оператора';
  optionsEl.appendChild(label);

  current.options.forEach(function (opt) {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';
    btn.textContent = opt.text;
    btn.addEventListener('click', function () {
      choose(opt, btn);
    });
    optionsEl.appendChild(btn);
  });
}

function choose(opt, btn) {
  document.querySelectorAll('.option').forEach(function (b) {
    b.disabled = true;
  });

  if (opt.correct) {
    /* верный ответ */
    addMessage(opt.text, 'operator');
    btn.classList.add('correct');

    if (firstTry) score++;

    optionsEl.innerHTML = '';
    addFeedback(opt.feedback, true, 'Верно!');

    step++;
    updateProgress();

    setTimeout(startStep, 1500);

  } else {
    /* неверный ответ */
    addMessage(opt.text, 'operator', 'wrong');
    btn.classList.add('wrong');

    firstTry = false;
    addFeedback(opt.feedback, false, 'Не лучший вариант.');

    setTimeout(function () {
      document.querySelectorAll('.option').forEach(function (b) {
        if (!b.classList.contains('wrong')) b.disabled = false;
      });
    }, 500);
  }
}

/* ---------- финал ---------- */
function finish() {
  progressEl.style.width = '100%';
  stepLabel.textContent = 'Кейс завершён';
  optionsEl.innerHTML = '';

  const total = scenario.length;
  const ratio = score / total;

  let title, sub;

  if (score === total) {
    title = 'Отлично! 🎉';
    sub = 'Вы провели диалог как опытный специалист поддержки: спокойно, по шагам, с заботой о времени курьера.';
  } else if (ratio >= 0.5) {
    title = 'Хороший результат 👍';
    sub = 'Основные шаги выполнены верно. Пересмотрите шаги, где вы сомневались, — там были более точные и безопасные формулировки.';
  } else {
    title = 'Стоит повторить';
    sub = 'Попробуйте пройти кейс ещё раз. Выбирайте варианты, где есть конкретная инструкция, запрос доказательств и уважение к времени курьера.';
  }

  const card = document.createElement('div');
  card.className = 'result';
  card.innerHTML =
    '<div class="result-title">' + title + '</div>' +
    '<div class="result-score">' + score + ' / ' + total +
      '<span>правильных ответов с первой попытки</span></div>' +
    '<div class="result-sub">' + sub + '</div>';

  chatEl.appendChild(card);
  scrollDown();

  const btn = document.createElement('button');
  btn.className = 'restart';
  btn.type = 'button';
  btn.textContent = 'Пройти заново';
  btn.addEventListener('click', reset);
  optionsEl.appendChild(btn);
}

/* ---------- перезапуск ---------- */
function reset() {
  step = 0;
  score = 0;
  firstTry = true;
  chatEl.innerHTML = '';
  optionsEl.innerHTML = '';
  progressEl.style.width = '0%';
  startStep();
}

/* ---------- старт ---------- */
startStep();
</script>

</body>
</html>
