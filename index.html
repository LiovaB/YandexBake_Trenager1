<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Диалоговый тренажёр — Кейсы по поломкам и неисправностям байка</title>
<style>
  /* ============ ШРИФТЫ ============ */
  /* YS Geo Heavy — проприетарный шрифт Яндекса.
     Если он установлен в системе / подгружен через @font-face на стороне LMS,
     браузер возьмёт его. Иначе — фолбэк на YS Text и системные. */
  @font-face {
    font-family: 'YS Geo';
    src: local('YS Geo Heavy'),
         local('YSGeo-Heavy'),
         local('YS Geo');
    font-weight: 900;
    font-style: normal;
    font-display: swap;
  }

  /* ============ БАЗА ============ */
  * { box-sizing: border-box; }

  :root {
    --gold: #FFD700;
    --white: #FFFFFF;
    --grey: #E9E7E6;
    --ink: #1A1A1A;
    --muted: #8A8A8A;
    --red: #E5484D;
    --red-bg: #FFF2F2;
    --gold-bg: #FFF8DC;
  }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: 'YS Text', 'YSText', 'YS Text Regular',
                 -apple-system, BlinkMacSystemFont, 'Segoe UI',
                 Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--grey);
    color: var(--ink);
    display: flex;
    justify-content: center;
    align-items: stretch;
    padding: 24px 16px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ КАРКАС ============ */
  .app {
    width: 100%;
    max-width: 780px;
    background: var(--white);
    border-radius: 6px;
    box-shadow: 0 10px 40px rgba(0,0,0,.08);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: calc(100vh - 48px);
    min-height: 580px;
  }

  /* ============ ШАПКА ============ */
  .header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--grey);
    background: var(--white);
  }

  .header-top { display: flex; align-items: center; gap: 12px; }

  .logo {
    width: 38px; height: 38px;
    border-radius: 6px;
    background: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }

  /* ---------- ЗАГОЛОВОК: YS Geo Heavy ---------- */
  .header h1 {
    font-family: 'YS Geo', 'YS Text', 'YSText', 'YS Text Regular',
                 -apple-system, BlinkMacSystemFont, 'Segoe UI',
                 Roboto, 'Helvetica Neue', Arial, sans-serif;
    font-weight: 900;
    font-size: 20px;
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--ink);
  }

  .header p {
    margin: 4px 0 0;
    font-size: 12.5px;
    color: var(--muted);
  }

  .progress-wrap {
    margin-top: 16px;
    display: flex; align-items: center; gap: 12px;
  }

  .progress {
    flex: 1; height: 6px;
    background: var(--grey);
    border-radius: 2px; overflow: hidden;
  }

  .progress span {
    display: block; height: 100%; width: 0;
    background: var(--gold);
    border-radius: 2px;
    transition: width .45s cubic-bezier(.4,0,.2,1);
  }

  .step-label {
    font-size: 12px; color: var(--muted); white-space: nowrap;
  }

  /* ============ ЧАТ ============ */
  .chat {
    flex: 1; overflow-y: auto;
    padding: 22px 24px;
    display: flex; flex-direction: column; gap: 14px;
    background: var(--white);
    scroll-behavior: smooth;
  }

  .chat::-webkit-scrollbar { width: 6px; }
  .chat::-webkit-scrollbar-thumb { background: var(--grey); border-radius: 2px; }

  /* ---------- РАЗДЕЛИТЕЛЬ КЕЙСОВ ---------- */
  .case-divider {
    position: relative;
    align-self: stretch;
    text-align: center;
    margin: 4px 0 6px;
    animation: pop .3s ease;
  }

  .case-divider::before {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 1px;
    background: var(--grey);
    z-index: 0;
  }

  .case-divider span {
    position: relative;
    z-index: 1;
    display: inline-block;
    background: var(--white);
    padding: 0 14px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- СООБЩЕНИЯ ---------- */
  .msg {
    display: flex; gap: 10px; align-items: flex-end;
    max-width: 86%;
    animation: pop .28s cubic-bezier(.2,.9,.3,1.2);
  }

  @keyframes pop {
    from { opacity: 0; transform: translateY(10px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .msg.courier  { align-self: flex-start; }
  .msg.operator { align-self: flex-end; flex-direction: row-reverse; }

  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; flex-shrink: 0;
    user-select: none;
  }

  .courier  .avatar { background: var(--grey); color: #6B6B6B; }
  .operator .avatar { background: var(--gold); color: var(--ink); }

  .bubble {
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-line;
  }

  .courier .bubble {
    background: var(--grey);
    border-bottom-left-radius: 4px;
  }

  .operator .bubble {
    background: var(--gold);
    border-bottom-right-radius: 4px;
  }

  .msg.operator.wrong .bubble {
    background: var(--red-bg);
    border: 1.5px dashed var(--red);
    color: #8C1D22;
  }

  /* ---------- ПЕЧАТАЕТ ---------- */
  .typing { display: flex; gap: 5px; align-items: center; padding: 14px 16px; }
  .typing i {
    width: 7px; height: 7px; border-radius: 50%;
    background: #B4B0AE; display: block;
    animation: blink 1.3s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }

  @keyframes blink {
    0%, 60%, 100% { opacity: .35; transform: translateY(0); }
    30%           { opacity: 1;   transform: translateY(-3px); }
  }

  /* ============ ФИДБЕК ============ */
  .feedback {
    align-self: center;
    max-width: 94%;
    font-size: 13.5px;
    line-height: 1.5;
    padding: 12px 16px;
    border-radius: 4px;
    animation: pop .28s ease;
  }

  .feedback.ok  { background: var(--gold-bg); border-left: 4px solid var(--gold); }
  .feedback.err { background: var(--red-bg);  border-left: 4px solid var(--red); }

  .feedback b { font-weight: 600; }

  /* ============ БЛОК ОТВЕТОВ ============ */
  .options {
    padding: 16px 24px 20px;
    border-top: 1px solid var(--grey);
    background: var(--white);
    display: flex; flex-direction: column; gap: 10px;
    max-height: 46%; overflow-y: auto;
  }

  .options-label {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--muted);
    margin-bottom: 2px;
  }

  .option {
    text-align: left;
    padding: 14px 16px;
    border-radius: 4px;
    border: 1.5px solid var(--grey);
    background: var(--white);
    font-family: inherit;
    font-size: 14px;
    line-height: 1.45;
    color: var(--ink);
    cursor: pointer;
    transition: border-color .18s, background .18s, transform .12s;
  }

  .option:hover:not(:disabled) {
    border-color: var(--gold);
    background: #FFFDF2;
  }

  .option:active:not(:disabled) { transform: scale(.99); }

  .option:disabled { cursor: default; opacity: .5; }

  .option.wrong {
    border-color: var(--red);
    background: var(--red-bg);
    opacity: 1; cursor: default;
  }

  .option.correct {
    border-color: var(--gold);
    background: var(--gold-bg);
    opacity: 1; cursor: default;
  }

  .option.primary {
    background: var(--gold);
    border-color: var(--gold);
    font-weight: 600;
    text-align: center;
  }

  .option.primary:hover:not(:disabled) {
    filter: brightness(.96);
    background: var(--gold);
  }

  /* ============ ФИНАЛ ============ */
  .result {
    align-self: center;
    width: 100%;
    max-width: 480px;
    background: var(--white);
    border: 2px solid var(--gold);
    border-radius: 6px;
    padding: 24px;
    text-align: center;
    animation: pop .35s ease;
  }

  .result-title {
    font-family: 'YS Geo', 'YS Text', 'YSText', 'YS Text Regular',
                 -apple-system, BlinkMacSystemFont, 'Segoe UI',
                 Roboto, 'Helvetica Neue', Arial, sans-serif;
    font-weight: 900;
    font-size: 22px;
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin-bottom: 10px;
  }

  .result-score {
    font-size: 34px; font-weight: 700;
    color: var(--ink); line-height: 1; margin-bottom: 12px;
  }

  .result-score span {
    display: block; font-size: 12px; font-weight: 400;
    color: var(--muted); margin-top: 6px; letter-spacing: .02em;
  }

  .result-sub { font-size: 14px; line-height: 1.5; color: #4A4A4A; }

  .restart {
    padding: 15px 20px;
    border-radius: 4px;
    border: none;
    background: var(--gold);
    color: var(--ink);
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: filter .18s, transform .12s;
  }

  .restart:hover { filter: brightness(.95); }
  .restart:active { transform: scale(.99); }

  /* ============ МОБИЛЬНЫЕ ============ */
  @media (max-width: 600px) {
    body { padding: 0; }
    .app {
      border-radius: 0;
      height: 100vh; min-height: 100vh; max-width: 100%;
    }
    .header  { padding: 16px 16px 14px; }
    .chat    { padding: 18px 16px; }
    .options { padding: 14px 16px 18px; }
    .msg     { max-width: 94%; }
    .bubble  { font-size: 14px; }
    .header h1 { font-size: 17px; }
    .result-title { font-size: 19px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="header-top">
      <div class="logo">🛴</div>
      <div>
        <h1>Кейсы по поломкам и неисправностям байка</h1>
        <p>Тренажёр для специалиста поддержки · аренда электровелосипедов</p>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress"><span id="progressFill"></span></div>
      <div class="step-label" id="stepLabel">Шаг 1 из 9</div>
    </div>
  </header>

  <main class="chat" id="chat"></main>
  <section class="options" id="options"></section>
</div>

<script>
/* =========================================================
   СЦЕНАРИЙ ТРЕНАЖЁРА
   ========================================================= */
const cases = [

  /* ================= КЕЙС 1 ================= */
  {
    title: "Кейс 1. Байк не открывается",
    steps: [
      {
        courier: "Почему байк не открывается?! Приложение пишет ошибку или просто висит. Я не могу начать смену, время уходит! Срочно решите вопрос!",
        options: [
          {
            correct: true,
            text: "Здравствуйте! Вот небольшая инструкция: 1. Убедитесь, что в Яндекс Байк и на дисплее электровелосипеда нет мигающих красным или жёлтым индикаторов. 2. Попробуйте переподключить батарею.",
            feedback: "Вы дали конкретную пошаговую инструкцию и сразу подключили курьера к диагностике. Это экономит его время и решает проблему на первом уровне поддержки."
          },
          {
            correct: false,
            text: "Понял вас, давайте попробуем начать с простого: полностью закройте приложение Яндекс Байк, откройте заново и попробуйте снова разблокировать байк.",
            feedback: "Шаг сам по себе рабочий, но он не проверяет состояние самого байка. Если проблема в железе, перезапуск приложения ничего не даст. Сначала — проверка индикаторов и батареи."
          },
          {
            correct: false,
            text: "Похоже, байк действительно неисправен. Если рядом есть другой свободный байк — можете взять его, а этот мы пометим как требующий обслуживания.",
            feedback: "Преждевременный вывод: причина может быть в простом сбое, который устраняется за минуту. Оставляя байк, курьер теряет время на поиск нового, а байк уходит в сервис без причины. Сначала — базовая диагностика."
          }
        ]
      },
      {
        courier: "Попробовал, не помогло. Индикаторов нет, батарею переподключал. Байк всё равно не открывается.",
        options: [
          {
            correct: true,
            text: "Пришлите, пожалуйста, видео, подтверждающее поломку Байка. На записи должен быть чётко виден номер. Мы оперативно передадим материалы специалистам для решения вопроса.",
            feedback: "Отлично! Вы запросили доказательство поломки по регламенту, объяснили, что именно должно быть на видео, и обозначили следующий шаг."
          },
          {
            correct: false,
            text: "Хорошо, давайте попробуем ещё раз, но теперь внимательнее: отключите батарею, подождите 10–15 секунд и подключите до щелчка. Иногда с первого раза контакт не срабатывает.",
            feedback: "Курьер уже переподключал батарею. Давать то же действие в новой упаковке — значит тянуть время. Пора переходить к следующему этапу: запрос видео."
          },
          {
            correct: false,
            text: "Спасибо, что сообщили. Я сейчас проверю статус байка в системе — это может занять несколько минут. Пожалуйста, оставайтесь на связи.",
            feedback: "Вы пообещали действие, но не запросили ни доказательств, ни обозначили следующий шаг для курьера. Это создаёт «подвешенное» состояние. Правильно — запросить видео с номером байка и передать в работу специалистам."
          }
        ]
      },
      {
        courier: "Вот видео, номер видно. Посмотрите, пожалуйста, скорее, я жду.",
        options: [
          {
            correct: true,
            text: "Передаю ваше обращение специалисту, который поможет в решении вопроса, пожалуйста, подождите.",
            feedback: "Вы подтвердили, что видео получено, и обозначили передачу обращения специалисту — курьер понимает, что процесс идёт."
          },
          {
            correct: false,
            text: "Спасибо за видео! Вижу, что вы всё сделали правильно. Давайте попробуем ещё раз: закройте приложение полностью, откройте и попробуйте разблокировать байк заново.",
            feedback: "Вы возвращаете курьера к шагу, который уже не работает, и не передаёте обращение дальше. Это затягивает решение и снижает доверие к поддержке."
          },
          {
            correct: false,
            text: "Видео получил, спасибо. К сожалению, номер байка на записи читается не очень чётко — возможно, из-за блика. Могли бы вы переснять, немного приблизив камеру к номеру?",
            feedback: "Курьер написал, что номер видно. Если сомневаетесь — сначала перепроверьте запись сами. Отправлять на пересъёмку без проверки — значит обвинять клиента и терять время."
          }
        ]
      },
      {
        courier: "Жду. Надеюсь, быстро решите.",
        options: [
          {
            correct: true,
            text: "Ваше обращение зарегистрировано, специалист уже занимается им. Среднее время решения — до 15 минут, я остаюсь с вами на связи. Спасибо за терпение!",
            feedback: "Идеальное завершение: подтверждение, конкретный срок и готовность помочь дальше. Курьер чувствует, что его не бросили."
          },
          {
            correct: false,
            text: "К сожалению, точное время решения я вам назвать не могу — это зависит от загрузки специалистов. Как только будет новость, я сразу вам напишу.",
            feedback: "Формально честно, но курсант не получил ориентира. Курьер без понимания сроков тревожится сильнее. Нужно назвать хотя бы среднее время и остаться на связи."
          },
          {
            correct: false,
            text: "Принято. Если у вас появятся ещё вопросы — обращайтесь, мы всегда на связи.",
            feedback: "Преждевременное завершение диалога. Обращение ещё не решено, курьер без байка и без понимания сроков. Диалог закрывать рано."
          }
        ]
      }
    ]
  },

  /* ================= КЕЙС 2 ================= */
  {
    title: "Кейс 2. Быстро разряжается батарея",
    steps: [
      {
        courier: "Здравствуйте. Заметил, что батарея на байке стала очень быстро разряжаться. Недавно начал смену, а заряд уже падает на глазах. Подскажите, что можно сделать?",
        options: [
          {
            correct: true,
            text: "Здравствуйте! Если батарея электровелосипеда разряжается больше, чем на 10% за 10 минут, замените её в ближайшем пункте выдачи электровелосипедов. Их адреса можно посмотреть в приложении.",
            feedback: "Вы дали чёткий критерий (10% за 10 минут) и конкретное действие — замена батареи в пункте выдачи. Курьер понимает, когда и что делать."
          },
          {
            correct: false,
            text: "Понял вас. Давайте сначала проверим: возможно, это индикатор отображает заряд некорректно. Проедьте, пожалуйста, ещё 5–10 минут и напишите, как будет меняться процент.",
            feedback: "Затягиваете решение. Курьер уже наблюдает быстрый разряд — это достаточное основание для замены. Просить его кататься ещё — значит рисковать тем, что байк встанет посреди маршрута."
          },
          {
            correct: false,
            text: "Такое бывает в холодную погоду — батареи действительно разряжаются быстрее. Скажите, на улице сейчас минус? Если да, это может быть естественной причиной.",
            feedback: "Формулировка звучит разумно, но не решает проблему. Курьеру нужен понятный критерий и действие, а не уточнение погоды. Правильно — дать порог 10% за 10 минут и направить в пункт выдачи."
          }
        ]
      },
      {
        courier: "Понял",
        options: [
          {
            correct: true,
            text: "Рады помочь! Если возникнут ещё вопросы — пишите, мы на связи. Хорошей смены!",
            feedback: "Тёплое и открытое завершение. Курьер чувствует поддержку и знает, куда вернуться, если что-то пойдёт не так."
          },
          {
            correct: false,
            text: "Хорошо, обращайтесь, если что-то ещё понадобится.",
            feedback: "Корректно, но не хватает тепла и пожелания. Пара добрых слов в конце диалога — это часть сервиса, а не формальность."
          },
          {
            correct: false,
            text: "Учтите, пожалуйста: если батарея разрядится посреди маршрута, байк придётся оставить на месте, а это может занять время. Лучше заменить её заранее.",
            feedback: "Мысль верная, но подача — через страх и давление. Курьер и так торопится, не стоит усиливать стресс. Лучше завершить диалог тепло и по-человечески."
          }
        ]
      }
    ]
  },

  /* ================= КЕЙС 3 ================= */
  {
    title: "Кейс 3. Прокол колеса",
    steps: [
      {
        courier: "Здравствуйте. У меня прокололось колесо. Что делать? Я на заказе, время идёт.",
        options: [
          {
            correct: true,
            text: "Здравствуйте. Обратитесь в ближайший велоцентр. Адреса можно посмотреть в приложении. Специалисты бесплатно заменят вам камеру на пробитом колесе.",
            feedback: "Вы сразу дали решение (велоцентр), уточнили, что замена бесплатная, и указали, где искать адреса."
          },

/* =========================================================
   ЛОГИКА
   ========================================================= */
const chatEl     = document.getElementById('chat');
const optionsEl  = document.getElementById('options');
const progressEl = document.getElementById('progressFill');
const stepLabel  = document.getElementById('stepLabel');

const totalSteps = cases.reduce(function (sum, c) { return sum + c.steps.length; }, 0);

let caseIndex      = 0;
let stepIndex      = 0;
let completedSteps = 0;
let score          = 0;
let firstTry       = true;
let branchesShown  = new Set();

/* ---------- утилиты ---------- */
function scrollDown() { chatEl.scrollTop = chatEl.scrollHeight; }

/* Перемешивание Фишера–Йетса */
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function addMessage(text, type, mod) {
  const row = document.createElement('div');
  row.className = 'msg ' + type + (mod ? ' ' + mod : '');

  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = type === 'courier' ? 'К' : 'О';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  row.append(av, bubble);
  chatEl.appendChild(row);
  scrollDown();
}

function addFeedback(text, ok, prefix) {
  const box = document.createElement('div');
  box.className = 'feedback ' + (ok ? 'ok' : 'err');
  box.innerHTML = (prefix ? '<b>' + prefix + '</b> ' : '') + text;
  chatEl.appendChild(box);
  scrollDown();
}

function addCaseDivider(title) {
  const div = document.createElement('div');
  div.className = 'case-divider';
  const span = document.createElement('span');
  span.textContent = title;
  div.appendChild(span);
  chatEl.appendChild(div);
  scrollDown();
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'msg courier';
  row.id = 'typingRow';
  row.innerHTML =
    '<div class="avatar">К</div>' +
    '<div class="bubble typing"><i></i><i></i><i></i></div>';
  chatEl.appendChild(row);
  scrollDown();
}

function updateProgress() {
  const done = Math.min(completedSteps, totalSteps);
  progressEl.style.width = (done / totalSteps * 100) + '%';
  if (completedSteps < totalSteps) {
    stepLabel.textContent = 'Шаг ' + (completedSteps + 1) + ' из ' + totalSteps;
  }
}

/* ---------- шаги ---------- */
function startStep() {
  if (caseIndex >= cases.length) { finish(); return; }

  const currentCase = cases[caseIndex];

  if (stepIndex >= currentCase.steps.length) {
    caseIndex++;
    stepIndex = 0;
    startStep();
    return;
  }

  const step = currentCase.steps[stepIndex];

  updateProgress();
  firstTry = true;
  optionsEl.innerHTML = '';

  if (stepIndex === 0) addCaseDivider(currentCase.title);

  showTyping();

  setTimeout(function () {
    const typing = document.getElementById('typingRow');
    if (typing) typing.remove();

    addMessage(step.courier, 'courier');
    renderOptions(step);
  }, 800);
}

function renderOptions(step) {
  optionsEl.innerHTML = '';

  const label = document.createElement('div');
  label.className = 'options-label';
  label.textContent = 'Выберите ответ оператора';
  optionsEl.appendChild(label);

  /* Перемешиваем варианты при каждом показе шага */
  const shuffled = shuffleArray(step.options);

  shuffled.forEach(function (opt) {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';
    btn.textContent = opt.text;
    btn.addEventListener('click', function () { choose(opt, btn, step); });
    optionsEl.appendChild(btn);
  });
}

function choose(opt, btn, step) {
  document.querySelectorAll('.option').forEach(function (b) { b.disabled = true; });

  if (opt.correct) {
    addMessage(opt.text, 'operator');
    btn.classList.add('correct');

    if (firstTry) score++;

    optionsEl.innerHTML = '';
    addFeedback(opt.feedback, true, 'Верно!');

    completedSteps++;
    updateProgress();

    if (step.branch) {
      branchesShown = new Set();
      setTimeout(function () { renderBranch(step); }, 1200);
      return;
    }

    stepIndex++;
    setTimeout(startStep, 1500);

  } else {
    addMessage(opt.text, 'operator', 'wrong');
    btn.classList.add('wrong');

    firstTry = false;
    addFeedback(opt.feedback, false, 'Не лучший вариант.');

    setTimeout(function () {
      document.querySelectorAll('.option').forEach(function (b) {
        if (!b.classList.contains('wrong')) b.disabled = false;
      });
    }, 500);
  }
}

/* ---------- развилка ---------- */
function renderBranch(step) {
  optionsEl.innerHTML = '';

  const label = document.createElement('div');
  label.className = 'options-label';
  label.textContent = step.branch.prompt;
  optionsEl.appendChild(label);

  /* Варианты развилки оставляем в исходном порядке (А, Б) */
  step.branch.options.forEach(function (br, i) {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';

    if (branchesShown.has(i)) {
      btn.disabled = true;
      btn.style.opacity = '0.55';
      btn.textContent = '✓ ' + br.label;
    } else {
      btn.textContent = br.label;
      btn.addEventListener('click', function () {
        showBranchOutcome(step, br, i);
      });
    }

    optionsEl.appendChild(btn);
  });

  const finishBtn = document.createElement('button');
  finishBtn.className = 'option primary';
  finishBtn.type = 'button';
  finishBtn.textContent = 'Завершить тренажёр';
  finishBtn.addEventListener('click', finish);
  optionsEl.appendChild(finishBtn);

  scrollDown();
}

function showBranchOutcome(step, br, idx) {
  branchesShown.add(idx);
  optionsEl.innerHTML = '';

  addMessage(br.courier, 'courier');

  setTimeout(function () {
    addMessage(br.operator, 'operator');

    setTimeout(function () {
      addFeedback(
        br.outcomeText,
        br.outcome === 'success',
        br.outcome === 'success' ? 'Успех!' : 'Развилка завершена:'
      );

      setTimeout(function () { renderBranch(step); }, 800);
    }, 800);
  }, 800);
}

/* ---------- финал ---------- */
function finish() {
  progressEl.style.width = '100%';
  stepLabel.textContent = 'Тренажёр завершён';
  optionsEl.innerHTML = '';

  const total = totalSteps;
  const ratio = total > 0 ? score / total : 0;

  let title, sub;
  if (score === total) {
    title = 'Отлично! 🎉';
    sub = 'Вы провели все диалоги как опытный специалист поддержки: спокойно, по шагам, с заботой о времени курьера.';
  } else if (ratio >= 0.5) {
    title = 'Хороший результат 👍';
    sub = 'Основные шаги выполнены верно. Пересмотрите кейсы, где вы сомневались, — там были более точные и безопасные формулировки.';
  } else {
    title = 'Стоит повторить';
    sub = 'Попробуйте пройти кейсы ещё раз. Выбирайте варианты, где есть конкретная инструкция, запрос доказательств и уважение к времени курьера.';
  }

  const card = document.createElement('div');
  card.className = 'result';
  card.innerHTML =
    '<div class="result-title">' + title + '</div>' +
    '<div class="result-score">' + score + ' / ' + total +
      '<span>правильных ответов с первой попытки</span></div>' +
    '<div class="result-sub">' + sub + '</div>';

  chatEl.appendChild(card);
  scrollDown();

  const btn = document.createElement('button');
  btn.className = 'restart';
  btn.type = 'button';
  btn.textContent = 'Пройти заново';
  btn.addEventListener('click', reset);
  optionsEl.appendChild(btn);
}

/* ---------- перезапуск ---------- */
function reset() {
  caseIndex = 0;
  stepIndex = 0;
  completedSteps = 0;
  score = 0;
  firstTry = true;
  branchesShown = new Set();
  chatEl.innerHTML = '';
  optionsEl.innerHTML = '';
  progressEl.style.width = '0%';
  stepLabel.textContent = 'Шаг 1 из ' + totalSteps;
  startStep();
}

/* ---------- старт ---------- */
startStep();
</script>
